# Nginx Server Configuration for VertiWiki
# Place or include in your /etc/nginx/conf.d/ or sites-available/

# Map Accept header to detect AI coding agents requesting Markdown
map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

# Map Accept header to detect human browsers requesting HTML
map $http_accept $wants_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name docs.example.com;

    root /var/www/vertiwiki;
    index index.html;

    # Universal MIME types for Markdown and text
    types {
        text/markdown  md;
        text/plain     txt;
        text/html      html htm;
        application/json json;
        image/svg+xml  svg;
    }

    # Markdown files: Human browser visits redirect to VertiWiki UI, AI agents get raw Markdown
    location ~* ^/(.+\.md)$ {
        if ($wants_html) {
            return 302 /#/$1;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    # Universal CORS and Cache Headers for Documentation & AI Indices
    location ~* \.(txt|json)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        charset utf-8;
        try_files $uri =404;
    }

    # Root location with AI Content Negotiation and Human routing
    location / {
        # 1. AI Agents: Rewrite clean URLs to .md
        if ($wants_markdown) {
            rewrite ^/?$ /index.md last;
            rewrite ^(.+)/$ $1/index.md last;
            rewrite ^([^.]+)$ $1.md last;
        }

        # 2. Human browsers: Redirect clean URLs to VertiWiki hash route
        if ($wants_html) {
            rewrite ^/([^.]+)$ /#/$1.md redirect;
        }

        try_files $uri $uri/ =404;
    }
}
