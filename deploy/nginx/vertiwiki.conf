# Nginx Server Configuration for VertiWiki
# Place or include in your /etc/nginx/conf.d/ or sites-available/

# Map Accept header to detect AI coding agents requesting Markdown
map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    server_name docs.example.com;

    root /var/www/vertiwiki;
    index index.html;

    # Universal MIME types for Markdown and text
    types {
        text/markdown  md;
        text/plain     txt;
        text/html      html htm;
        application/json json;
        image/svg+xml  svg;
    }

    # Universal CORS and Cache Headers for Documentation & AI Indices
    location ~* \.(md|txt|json)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        charset utf-8;
        try_files $uri =404;
    }

    # Root location with AI Content Negotiation
    location / {
        if ($wants_markdown) {
            rewrite ^/?$ /index.md last;
            rewrite ^(.+)/$ $1/index.md last;
            rewrite ^([^.]+)$ $1.md last;
        }
        try_files $uri $uri/ =404;
    }
}
