<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vertiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c22" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <!-- Cyan Neon Accent Gradient -->
    <linearGradient id="vertiNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00eefc" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <radialGradient id="vertiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00eefc" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#00eefc" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00eefc" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Hex Shield -->
    <linearGradient id="vertiBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#00eefc" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="vertiNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="60" cy="60" r="45" fill="url(#vertiGlow)" />

  <!-- Outer Hexagon Frame -->
  <polygon points="60,8 104,33 104,87 60,112 16,87 16,33" 
           fill="url(#vertiBgGrad)" 
           stroke="url(#vertiBorderGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Inner Dynamic Verti Prism -->
  <g filter="url(#vertiNeonGlow)">
    <!-- Top Central Node -->
    <polygon points="60,24 88,40 60,56 32,40" 
             fill="none" 
             stroke="url(#vertiNeonGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round" 
             opacity="0.9" />

    <!-- Left Wing -->
    <polygon points="32,44 60,60 60,94 32,78" 
             fill="url(#vertiNeonGrad)" 
             fill-opacity="0.15" 
             stroke="url(#vertiNeonGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round" />

    <!-- Right Wing -->
    <polygon points="88,44 88,78 60,94 60,60" 
             fill="url(#vertiNeonGrad)" 
             fill-opacity="0.35" 
             stroke="url(#vertiNeonGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round" />

    <!-- Core Lightning Synapse -->
    <path d="M60,34 L66,54 L54,60 L62,82" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Connection Points -->
    <circle cx="60" cy="24" r="3" fill="#ffffff" />
    <circle cx="88" cy="40" r="3" fill="#00eefc" />
    <circle cx="32" cy="40" r="3" fill="#00eefc" />
    <circle cx="60" cy="94" r="3" fill="#00eefc" />
    <circle cx="32" cy="78" r="3" fill="#00eefc" />
    <circle cx="88" cy="78" r="3" fill="#00eefc" />
  </g>
</svg>
